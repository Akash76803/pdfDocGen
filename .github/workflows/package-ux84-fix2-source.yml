name: Package UX8.4 Fix2 Source ZIP

on:
  push:
    branches:
      - feat/ux8-conditional-rendering

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        run: |
          zip -r Document-Builder-UX8.4-Fix2-Conditional-Table-Auto-Reflow.zip .             -x ".git/*" "node_modules/*" "dist/*" "target/*"
      - uses: actions/upload-artifact@v4
        with:
          name: Document-Builder-UX8.4-Fix2-Conditional-Table-Auto-Reflow
          path: Document-Builder-UX8.4-Fix2-Conditional-Table-Auto-Reflow.zip
          if-no-files-found: error
