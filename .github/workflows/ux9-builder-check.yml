name: UX-9 Builder layout and frame verification
on:
  push:
    branches:
      - feat/ux9-layout-typography-image-frames
      - fix/ux9-shape-image-no-crop
      - feat/ux9-shape-image-expand
  pull_request:
    branches:
      - deploy/auth-ux2-cloud

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
