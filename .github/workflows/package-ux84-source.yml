name: Package UX8.4 Source ZIP

on:
  push:
    branches:
      - feat/ux8-conditional-rendering

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          zip -qr Document-Builder-UX8.4-Conditional-Rendering.zip . -x ".git/*" ".github/workflows/package-ux84-source.yml"
      - uses: actions/upload-artifact@v4
        with:
          name: Document-Builder-UX8.4-Conditional-Rendering
          path: Document-Builder-UX8.4-Conditional-Rendering.zip
          if-no-files-found: error
