name: AUTH-UX-3 OAuth exchange verification

on:
  push:
    branches:
      - fix/auth-ux3-backend-oauth-exchange
  pull_request:
    branches:
      - deploy/auth-ux2-cloud

permissions:
  contents: read

jobs:
  api-and-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  tauri-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
