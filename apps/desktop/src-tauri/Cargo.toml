[package]
name = "document-tool-desktop"
version = "1.0.0-rc.2"
description = "Document Tool Desktop Shell"
authors = ["Document Tool Contributors"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "^1.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "^1.6", features = [ "fs-create-dir", "fs-remove-file", "dialog-open", "dialog-save", "fs-exists", "fs-read-file", "fs-write-file", "path-all", "shell-open"] }
keyring = "2.3"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2.5"

[features]
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
