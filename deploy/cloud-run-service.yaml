apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: document-builder-api
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      serviceAccountName: document-builder-api@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/document-builder-api:TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: API_TEMPLATE_REPOSITORY_MODE
              value: "cloud"
            - name: API_GCP_TEMPLATE_BUCKET
              value: "PROJECT_ID-document-builder-assets"
            - name: API_GCP_FIRESTORE_DATABASE
              value: "(default)"
            - name: API_MAX_BODY_MB
              value: "20"
            - name: API_ABSOLUTE_MAX_BODY_MB
              value: "50"
            - name: API_GENERATION_TIMEOUT_MS
              value: "240000"
            - name: API_ABSOLUTE_GENERATION_TIMEOUT_MS
              value: "295000"
            - name: API_MAX_BATCH_DOCUMENTS
              value: "100"
            - name: API_ABSOLUTE_MAX_BATCH_DOCUMENTS
              value: "500"
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
