swagger: "2.0"
host: "pdf-doc-gen-api-1y5zaulqb93zz.apigateway.pdf-gen-509308.cloud.goog"
x-google-endpoints:
  - name: "pdf-doc-gen-api-1y5zaulqb93zz.apigateway.pdf-gen-509308.cloud.goog"
    allowCors: true
info:
  title: pdfDocGen Salesforce Gateway
  description: Secured public API surface for Salesforce-to-pdfDocGen document generation.
  version: "1.0.0"
schemes:
  - https
produces:
  - application/json
consumes:
  - application/json

x-google-backend:
  address: https://pdf-doc-gen-api-staging-933068485086.us-central1.run.app
  jwt_audience: https://pdf-doc-gen-api-staging-933068485086.us-central1.run.app
  path_translation: APPEND_PATH_TO_ADDRESS
  deadline: 300.0

paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: API health response

  # Public OAuth bootstrap: Google authorization code is only exchanged by Cloud Run.
  /api/v1/auth/google/exchange:
    post:
      operationId: exchangeGoogleAuthorizationCode
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [code, codeVerifier, redirectUri]
            properties:
              code:
                type: string
              codeVerifier:
                type: string
              redirectUri:
                type: string
              label:
                type: string
      responses:
        "201":
          description: Server-verified integration token created
        "400":
          description: Invalid one-time authorization grant
        "401":
          description: Google verification rejected
        "429":
          description: Request rate limited
        "503":
          description: OAuth exchange not configured or unavailable

  /api/v1/auth/tokens:
    post:
      operationId: createIntegrationCredential
      responses:
        "201":
          description: Integration credential created

  /api/v1/auth/tokens/current:
    delete:
      operationId: revokeCurrentIntegrationCredential
      responses:
        "200":
          description: Current integration credential revoked

  /api/v1/templates/{templateId}/publish:
    put:
      operationId: publishTemplate
      parameters:
        - in: path
          name: templateId
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            type: object
      responses:
        "200":
          description: Updated cloud template version
        "201":
          description: First cloud template publication
        "400":
          description: Invalid template payload or version
        "401":
          description: Invalid or missing desktop identity token
        "403":
          description: Authenticated user is not allowed to publish
        "409":
          description: Template version conflict
        "413":
          description: Payload limit exceeded
        "500":
          description: Publication failed
        "503":
          description: Publication storage unavailable

  /api/v1/documents/generate:
    post:
      operationId: generateDocument
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
      responses:
        "200":
          description: Generated document
        "400":
          description: Invalid request
        "401":
          description: Invalid or missing client bearer token
        "413":
          description: Payload limit exceeded
        "422":
          description: Rendering/generation validation failure
        "429":
          description: Rate limit exceeded
        "500":
          description: Generation failed
        "503":
          description: Generation service unavailable
        "504":
          description: Generation deadline exceeded

  /api/v1/documents/generate/batch:
    post:
      operationId: generateDocumentBatch
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
      responses:
        "200":
          description: Generated batch output
        "400":
          description: Invalid request
        "401":
          description: Invalid or missing client bearer token
        "413":
          description: Payload or batch limit exceeded
        "422":
          description: Rendering/generation validation failure
        "429":
          description: Rate limit exceeded
        "500":
          description: Generation failed
        "503":
          description: Generation service unavailable
        "504":
          description: Generation deadline exceeded
